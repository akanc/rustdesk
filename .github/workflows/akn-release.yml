name: AKN Release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/akn-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AKNDesk-windows-exe
          run-id: 44082246833
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create akn-v1 out/AKNDesk.exe -R ${{ github.repository }} --title "AKNDesk v1" --notes "AKN markali RustDesk (Windows 64-bit)" --latest
